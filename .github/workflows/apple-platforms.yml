# Builds the package for every Apple platform it declares support for, through
# the Xcode build system, and runs its tests wherever a runner can boot the
# destination. The Xcode-to-Swift mapping, the runner images and the simulator
# lookup live in sinoru/github-workflows; what is here is what is particular to
# this package.
#
# This is a different axis from swift.yml, not a duplicate of it. `swift build`
# drives SwiftPM's own llbuild graph while `xcodebuild` generates an Xcode one
# from the same manifest; the two diverge on C target module maps and on how
# `swiftSettings` flags propagate, so macOS appears in both workflows on
# purpose.

name: Apple Platforms

# Pushes only fire on the branches git-flow keeps around: the two long-lived
# ones plus the release-prep pair. Short-lived feature branches are covered by
# the pull_request trigger when they open against develop, so listing them here
# would only run the same commit twice.
#
# And only for a change that can alter what is built here: the sources, the
# tests, the manifest and what it resolved to, and this file. A commit to the
# README or the changelog runs nothing. A branch filter and a path filter must
# both be satisfied.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: &paths
      - Sources/**
      - Tests/**
      - Package.swift
      - Package.resolved
      - .github/workflows/apple-platforms.yml
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both configurations, and each runs what only it can show, as swift.yml
  # does and for its reasons: Release is the library as a client gets it,
  # where the optimizer's bugs are, built without testability so that what is
  # stressed is what ships; Debug is where `@testable import` works, and where
  # the unit tests that need it are compiled at all. Release matters most on
  # the watchOS device row, whose 32-bit pointer branch is compiled nowhere
  # else.
  #
  # The Swift axis moves the platform SDKs along with the compiler, which is
  # what makes it worth crossing with the platforms rather than sampling one
  # corner. The iOS and tvOS device rows are where the crossing says most: the
  # gate in CSynchronizationKitAtomic.h declares the atomics out of line for
  # those two under Swift 6.3 and leaves them inline under 6.4, so each minor
  # builds a side of it the other does not.
  #
  # Device and simulator are separate SDKs and separate target triples, so
  # they fail independently. On watchOS they also take opposite branches: the
  # device builds arm64_32 with 32-bit pointers, the simulator arm64 with
  # 64-bit, which is the only pair that covers both sides of
  # `#if _pointerBitWidth(_64)` in AtomicStorage.swift. Nothing is attached to
  # a runner to run a watch binary on, so that 32-bit branch is only ever
  # compiled here.
  #
  # The pinned rows are older releases, which the plain rows can never reach:
  # an image only ever carries the current runtime, and two things about this
  # package can only be answered by an OS that predates it. `RWLock` picks its
  # sleep and wake from the OS version, so the Mach semaphore backend that
  # ships to releases before macOS 14.4 and its siblings would be compiled and
  # never run; nothing in the package can force it, by design. And `Mutex`
  # and `Atomic` are back-deployed implementations whose raw-layout metadata
  # initialization resolves against the Swift runtime the OS itself carries,
  # a different one in every major, so supporting a release is a claim only
  # that release can settle.
  #
  # One row per major, not per minor: within a major the runtime is the same
  # and neither question is asked twice. The oldest minor of each is pinned,
  # so a row moves only when Apple stops serving that version. The floors this
  # package declares, iOS 15, tvOS 15 and watchOS 8, are missing because Apple
  # no longer serves them: `-downloadPlatform` reports iOS 15.5, tvOS 15.4 and
  # every watchOS 8 as not available, whatever Xcode's own platform list
  # offers. The oldest fetchable release of each stands in.
  #
  # The pinned rows are held to Swift 6.3 rather than crossed with the axis.
  # Crossing would say something, the compiler choosing which metadata
  # initializer to emit, but every minor it crossed with would repeat eleven
  # multi-gigabyte downloads to say it, and the jobs queue five at a time.
  # 6.3 is where each pin was found to be fetchable.
  apple-platforms:
    uses: sinoru/github-workflows/.github/workflows/apple-platforms.yml@main
    with:
      scheme: SynchronizationKit
      swift: '["6.3", "6.4"]'
      configurations: |
        [
          { "name": "Debug", "skip": "StressTests" },
          { "name": "Release", "only": "StressTests" }
        ]
      targets: |
        [
          "arm64-apple-macosx",
          "arm64-apple-ios-macabi",
          "arm64-apple-ios",
          "arm64-apple-ios-simulator",
          "arm64-apple-tvos",
          "arm64-apple-tvos-simulator",
          "arm64_32-apple-watchos",
          "arm64-apple-watchos-simulator",
          "arm64-apple-xros",
          "arm64-apple-xros-simulator",
          { "triple": "arm64-apple-ios-simulator", "runtime": "16.4", "swift": ["6.3"] },
          { "triple": "arm64-apple-ios-simulator", "runtime": "17.5", "swift": ["6.3"] },
          { "triple": "arm64-apple-ios-simulator", "runtime": "18.6", "swift": ["6.3"] },
          { "triple": "arm64-apple-tvos-simulator", "runtime": "16.4", "swift": ["6.3"] },
          { "triple": "arm64-apple-tvos-simulator", "runtime": "17.5", "swift": ["6.3"] },
          { "triple": "arm64-apple-tvos-simulator", "runtime": "18.5", "swift": ["6.3"] },
          { "triple": "arm64-apple-watchos-simulator", "runtime": "9.4", "swift": ["6.3"] },
          { "triple": "arm64-apple-watchos-simulator", "runtime": "10.5", "swift": ["6.3"] },
          { "triple": "arm64-apple-watchos-simulator", "runtime": "11.5", "swift": ["6.3"] },
          { "triple": "arm64-apple-xros-simulator", "runtime": "1.2", "swift": ["6.3"] },
          { "triple": "arm64-apple-xros-simulator", "runtime": "2.5", "swift": ["6.3"] }
        ]
