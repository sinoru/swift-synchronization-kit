# Builds the package through SwiftPM across the Swift toolchains it claims to
# support, on every target the runners can reach, and runs the benchmarks on
# the two hosts the harness runs on. The toolchain setup, the matrix and the
# build steps live in sinoru/github-workflows; what is here is what is
# particular to this package. The Xcode build system takes a different path
# through the same manifest, so Apple platform coverage lives in
# apple-platforms.yml instead.

name: Swift

# Pushes only fire on the branches git-flow keeps around: the two long-lived
# ones plus the release-prep pair. Short-lived feature branches are covered by
# the pull_request trigger when they open against develop, so listing them here
# would only run the same commit twice.
#
# And only for a change that can alter what is built here: the sources, the
# tests, the benchmarks, the manifest and what it resolved to, and this file.
# A commit to the README or the changelog runs nothing. A branch filter and a
# path filter must both be satisfied.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: &paths
      - Sources/**
      - Tests/**
      - Benchmarks/**
      - Package.swift
      - Package.resolved
      - .github/workflows/swift.yml
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two minors, every target, both configurations, and each configuration runs
  # what only it can show. Release is the library as a client gets it, and a
  # lock is a type whose bugs the optimizer is entitled to create: reordering,
  # dead stores, accesses folded into a register. A debug run cannot see any
  # of them, so the stress suites run in Release, built without testability so
  # that what is stressed is what ships, and at their long scale: `stressScale`
  # in the test utils says what the flag does and why the factor is not
  # higher. Debug is where `@testable import` works, so the unit tests run
  # there, the stress suites skipped. Every test runs in exactly one of the
  # two.
  #
  # The second minor is not a repeat of the first. 6.3 is the floor the
  # manifest declares and 6.4 the newest, and the sources tell them apart with
  # `#if compiler(>=6.4)`: how an `unsafe` marker is spelled, and whether the
  # asynchronous locks install a priority escalation handler at all.
  #
  # Swift Testing alone, everywhere: no XCTest case is left in the package,
  # and the corelibs runner traps on an empty list rather than reporting none.
  #
  # The targets, and why each is here:
  #
  # - macOS Intel is held to 6.3: no Intel image carries Xcode 27. It is the
  #   one place the suite runs on x86_64 Darwin, otherwise compiled and never
  #   run.
  # - Linux arm64 is the only Linux whose memory ordering is weak: on x86_64 a
  #   missing barrier in a lock mostly goes unnoticed, and the pthread backends
  #   would otherwise meet arm64 nowhere.
  # - Windows takes the kernel-semaphore backend for Semaphore and, on it, the
  #   built RWLock, and nothing else on the matrix builds either.
  # - Linux musl cross-compiles through the static SDK, whose rwlock cannot be
  #   configured away from reader-preferring, so the semaphore-based RWLock
  #   backend compiles here. Build only: the SDK ships no testing library.
  # - WebAssembly wasip1 is the single-threaded flavor, on which `Semaphore` is
  #   absent and `RWLock` an exclusive mutex; the suites that drive threads
  #   are compiled out. The stress suites run at their short scale: the Wasm
  #   SDK emits no tail calls, so an `await` that never suspends nests a frame
  #   instead of unwinding one, and the long scale's thousands in a row
  #   exhaust the interpreter's call stack.
  # - Android API 28 is the only place the bionic side of every
  #   `canImport(Android)` branch is compiled, and the only one that shows
  #   whether bionic's `pthread_rwlock_t` honors the writer-preferring kind
  #   the way glibc's does. The stress suites run at their short scale: how
  #   fast an emulator's guest runs depends on what else the runner is doing,
  #   one test having measured 119 seconds on one run and 718 on another. The
  #   arm64 row is built only; nothing hosted can run it.
  # - The sanitized rows are a different build, not a different way of
  #   running one: one per backend the runners can reach, on each architecture
  #   that can reach it. ThreadSanitizer for an access it can see is
  #   unordered; AddressSanitizer for the kind it cannot, a reference read
  #   after it was freed, which this package has had once. The Mach semaphore
  #   backend is not among them, no runner being old enough to choose it; its
  #   annotations are checked by hand against a pre-17.4 simulator runtime.
  #   Undefined behavior gets no rows: `-sanitize=undefined` leaves Swift
  #   uninstrumented, and this package's C holds nothing for it to check.
  #
  # Rows marked experimental fail for reasons outside the package, and are
  # kept so that the day one is fixed upstream shows as a job turning green:
  #
  # - Windows on x86_64 under 6.4 aborts in the runtime's task allocator,
  #   "freed pointer was not the last allocation", in the asynchronous locks'
  #   tests wherever they are built for testing. (#5)
  # - Windows on arm64 loses an increment inside an `actor`, in the
  #   measurements' comparison and none of this package's code. The
  #   measurements have since moved to the benchmark package, which does not
  #   run on Windows, so the pair is kept marked until a run without them
  #   shows it clear. (#6)
  # - WebAssembly under 6.4: the toolchain's WasmKit implements `poll_oneoff`,
  #   so a sleep sleeps, and the cooperative executor sleeps to its next timer
  #   without looking at what became runnable meanwhile; every body waits out
  #   its whole deadline. The build is what the row still checks. (#4)
  # - Linux on arm64 loses a libdispatch worker during the asynchronous
  #   measurements, about one run in two, and a program with none of this
  #   package in it does the same once in 130 runs. Kept marked until a run
  #   without the measurements shows it clear; the sanitized arm64 rows never
  #   ran them and are not marked. (#11)
  swift:
    uses: sinoru/github-workflows/.github/workflows/swift.yml@main
    with:
      swift: '["6.3", "6.4"]'
      test-arguments: --disable-xctest
      configurations: |
        [
          { "name": "Debug", "skip": "StressTests" },
          { "name": "Release", "only": "StressTests",
            "arguments": "-Xswiftc -DSYNCHRONIZATIONKIT_LONG_TESTS" }
        ]
      targets: |
        [
          "arm64-apple-macosx",
          { "triple": "x86_64-apple-macosx", "swift": ["6.3"] },
          "x86_64-unknown-linux-gnu",
          { "triple": "aarch64-unknown-linux-gnu", "experimental": true },
          { "triple": "x86_64-unknown-windows-msvc", "swift": ["6.3"] },
          { "triple": "x86_64-unknown-windows-msvc", "swift": ["6.4"], "experimental": true },
          { "triple": "aarch64-unknown-windows-msvc", "experimental": true },
          "x86_64-swift-linux-musl",
          { "triple": "wasm32-unknown-wasip1", "swift": ["6.3"],
            "arguments": "-Xswiftc -DSYNCHRONIZATIONKIT_SHORT_TESTS" },
          { "triple": "wasm32-unknown-wasip1", "swift": ["6.4"], "experimental": true,
            "arguments": "-Xswiftc -DSYNCHRONIZATIONKIT_SHORT_TESTS" },
          { "triple": "x86_64-unknown-linux-android28",
            "arguments": "-Xswiftc -DSYNCHRONIZATIONKIT_SHORT_TESTS" },
          "aarch64-unknown-linux-android28",
          { "triple": "arm64-apple-macosx", "sanitize": "thread" },
          { "triple": "x86_64-apple-macosx", "swift": ["6.3"], "sanitize": "thread" },
          { "triple": "x86_64-unknown-linux-gnu", "sanitize": "thread" },
          { "triple": "aarch64-unknown-linux-gnu", "sanitize": "thread" },
          { "triple": "arm64-apple-macosx", "sanitize": "address" },
          { "triple": "x86_64-apple-macosx", "swift": ["6.3"], "sanitize": "address" },
          { "triple": "x86_64-unknown-linux-gnu", "sanitize": "address" },
          { "triple": "aarch64-unknown-linux-gnu", "sanitize": "address" }
        ]

  benchmarks-matrix:
    uses: sinoru/github-workflows/.github/workflows/matrix.yml@main
    with:
      swift: '["6.3", "6.4"]'
      targets: '["arm64-apple-macosx", "x86_64-unknown-linux-gnu"]'

  # The benchmarks, on the two hosts the harness runs on, one per minor. They
  # measure the library as it ships, built by the benchmark package's own
  # manifest against the checkout above it, and put the table in the job's
  # summary. Nothing fails on a number: a shared runner is noisy, and what the
  # numbers are for is reading, here and against a baseline taken on one
  # machine, which the README says how to do. `pipefail`, so that a benchmark
  # that crashes fails the step through the tee.
  benchmarks:
    needs: benchmarks-matrix
    name: Benchmarks · ${{ matrix.os }} · Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmarks-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: sinoru/github-workflows/actions/setup-swift@main
        with:
          version: ${{ matrix.patch }}
          developer-dir: ${{ matrix.developer_dir }}

      - name: Run benchmarks
        working-directory: Benchmarks
        run: |
          set -o pipefail
          swift package benchmark --format markdown --no-progress --grouping metric | tee "$RUNNER_TEMP/benchmarks.md"
          sed -n '/^## Baseline/,$p' "$RUNNER_TEMP/benchmarks.md" >> "$GITHUB_STEP_SUMMARY"
