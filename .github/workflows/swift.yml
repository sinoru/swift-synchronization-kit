# Builds the package through SwiftPM across the Swift toolchains it claims to
# support. The Xcode build system takes a different path through the same
# manifest, so Apple platform coverage lives in apple-platforms.yml instead.

name: Swift

# Pushes only fire on the branches git-flow keeps around: the two long-lived
# ones plus the release-prep pair. Short-lived feature branches are covered by
# the pull_request trigger when they open against develop, so listing them here
# would only run the same commit twice.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Both are inert where their matrix field is unset. DEVELOPER_DIR selects
    # the toolchain on macOS by pointing at a pinned Xcode: the runner keeps a
    # minor-level symlink at the current patch (Xcode_26.3.app ->
    # Xcode_26.3.1.app), so this survives patch churn. Swift 6.2 lives in Xcode
    # 26.0-26.3, 6.3 in 26.4+; each row is the newest patch of its Swift minor.
    # SWIFT_SDK carries the musl row's cross-compilation target into the build
    # steps below.
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      SWIFT_SDK: ${{ matrix.swift_sdk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS · Swift 6.2.4"
            runner: macos-26
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
          - name: "macOS · Swift 6.3.3"
            runner: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
          - name: "Linux · Swift 6.2"
            runner: ubuntu-latest
            swift: "6.2"
          - name: "Linux · Swift 6.3"
            runner: ubuntu-latest
            swift: "6.3"
          # Cross-compiles against musl through the static Linux SDK and runs
          # the fully static test binary on the glibc host. The SDK is only
          # compatible with the exact toolchain version that built it, so
          # unlike the floating rows above this one pins the toolchain to a
          # patch; `swift`, the URL, and the checksum are bumped together.
          - name: "Linux · Swift 6.3.3 · musl"
            runner: ubuntu-latest
            swift: "6.3.3"
            swift_sdk: x86_64-swift-linux-musl
            static_sdk_url: https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
            static_sdk_checksum: 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
    steps:
      - uses: actions/checkout@v7

      # macOS ships a full toolchain in Xcode; Linux does not, so it installs
      # one here. swiftly is swiftlang's own installer, invoked as a CLI rather
      # than a third-party action. A bare Swift minor ("6.2") resolves to its
      # newest patch, matching how the swift:6.2 container tag floats.
      #
      # Prereqs on the runner image: gnupg and ca-certificates (both present on
      # ubuntu-latest). --post-install-file captures any toolchain system
      # dependencies so they can be applied with sudo.
      #
      # Everything lands in swiftly's default location. The shims it puts on
      # PATH resolve the toolchain through SWIFTLY_HOME_DIR at run time, and
      # that variable does not survive the step that exported it — so relocating
      # the install would mean re-exporting it through GITHUB_ENV for every
      # later step. env.sh sets it here for the install itself.
      - name: Install Swift toolchain
        if: runner.os == 'Linux'
        run: |
          curl -fL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -C "$RUNNER_TEMP" -zxf "$RUNNER_TEMP/swiftly.tar.gz"
          "$RUNNER_TEMP/swiftly" init --verbose --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use "${{ matrix.swift }}" --post-install-file "$RUNNER_TEMP/swiftly-post-install.sh"
          if [ -f "$RUNNER_TEMP/swiftly-post-install.sh" ]; then
            sudo bash "$RUNNER_TEMP/swiftly-post-install.sh"
          fi
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - name: Install the static Linux SDK
        if: matrix.swift_sdk
        run: swift sdk install "${{ matrix.static_sdk_url }}" --checksum "${{ matrix.static_sdk_checksum }}"

      - run: swift --version
      - run: swift build -v ${SWIFT_SDK:+--swift-sdk "$SWIFT_SDK"}
      # On Linux `Synchronization` is already available, so the Atomic and Mutex
      # targets compile down to forwarding typealiases and their tests are gated
      # out. RWLock has no standard-library counterpart: its POSIX backend
      # builds here and runs its tests for real. The glibc rows take the
      # pthread_rwlock backend; musl's reader-preferring rwlock cannot be
      # configured away, so the musl row takes the semaphore-based backend
      # instead — each run is its backend's only automated coverage.
      #
      # SwiftPM treats a Swift SDK as a cross-compilation target and will not
      # run tests itself, but the binaries it produces there are fully static,
      # so that leg builds the test runner and executes it directly on the
      # host.
      - run: |
          if [ -n "$SWIFT_SDK" ]; then
            swift build -v --build-tests --swift-sdk "$SWIFT_SDK"
            ".build/$SWIFT_SDK/debug/SynchronizationKitPackageTests.xctest" --testing-library swift-testing
          else
            swift test -v
          fi
