# Temporary, and not to be merged: looks into the libdispatch crash on the
# Linux arm64 rows of swift.yml. A worker thread there dies in
# `_dispatch_worker_thread` on a root queue whose head is
# DISPATCH_OBJECT_LISTLESS, during the asynchronous locks' measurements, and
# on no other row.
#
# It has not been seen anywhere but on this runner, so the search happens
# here, and all at once: every question is a job, and each job runs over and
# over for as long as its budget lasts.
#
# The first round asked which commit brought it, and the answer was none: the
# commit before the push it first showed after crashes as often, for the time
# it runs, as develop does. The second asked whose bug it is, by giving each
# kind of measurement a process to itself, and the measurements that put an
# actor where the lock would be — none of this package's code — crashed
# fourteen times in 1249 runs. This round takes XCTest and the package away
# as well: `Reproducer` is those measurements as a program of its own, which
# is what a report upstream needs, and it runs on x86_64 beside arm64 to say
# whether the architecture is part of it.

name: Bisect

# Only a change to this file or to the program it runs starts it, and only
# from a pull request: the branch it lives on is pushed nowhere the other
# workflows listen.
on:
  pull_request:
    paths:
      - .github/workflows/bisect.yml
      - Reproducer/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bisect:
    name: Reproducer · ${{ matrix.arch.label }} · Swift ${{ matrix.swift }} · ${{ matrix.copy }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    # BUDGET is how long a job goes on starting runs, in seconds. ENOUGH is
    # how many failures stop a job early, which is there for a job that fails
    # for some other reason and would otherwise do so for its whole budget; it
    # is high because what is wanted is a rate. SWIFT_BACKTRACE asks the
    # runtime for the report `swift test` got for the asking in the rounds
    # before.
    env:
      BUDGET: 2100
      ENOUGH: 20
      SWIFT_BACKTRACE: enable=yes,interactive=no,color=no
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.4"]
        # The same job three times over: at the second round's rate a budget
        # holds three or four crashes, and an architecture that shows none
        # should have had the chance to show ten.
        copy: [a, b, c]
        arch:
          - { label: arm64, runner: ubuntu-24.04-arm }
          - { label: x86_64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7

      # As swift.yml installs it.
      - name: Install Swift toolchain
        run: |
          curl -fL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -C "$RUNNER_TEMP" -zxf "$RUNNER_TEMP/swiftly.tar.gz"
          "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use "${{ matrix.swift }}" --post-install-file "$RUNNER_TEMP/swiftly-post-install.sh"
          if [ -f "$RUNNER_TEMP/swiftly-post-install.sh" ]; then
            sudo bash "$RUNNER_TEMP/swiftly-post-install.sh"
          fi
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - run: swift --version

      - name: swift build
        run: |
          swift build -c release --package-path Reproducer
          echo "reproducer=$(swift build -c release --package-path Reproducer --show-bin-path)/reproducer" >> "$GITHUB_ENV"

      # A process a run, as the rounds before had. Passes are counted and not
      # shown, there being hundreds; a failure shows what the backtracer said.
      # The count goes to the run's summary, where the twelve jobs read as a
      # table.
      - name: Run the program until the budget is spent
        run: |
          runs=0 failures=0
          while [ $SECONDS -lt "$BUDGET" ] && [ $failures -lt "$ENOUGH" ]; do
            runs=$((runs + 1))
            if ! "$reproducer" > "$RUNNER_TEMP/run.log" 2>&1; then
              failures=$((failures + 1))
              echo "::group::run $runs failed at ${SECONDS}s"
              grep -A 6 -E "Program crashed|crashed:|Fatal error" "$RUNNER_TEMP/run.log" || tail -n 40 "$RUNNER_TEMP/run.log" | cut -c 1-300
              echo "::endgroup::"
            fi
          done
          echo "| ${{ matrix.arch.label }} | ${{ matrix.swift }} | ${{ matrix.copy }} | $failures of $runs | ${SECONDS}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "$failures of $runs runs failed in ${SECONDS}s"
          [ $failures -eq 0 ]
