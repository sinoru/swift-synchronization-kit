# Temporary, and not to be merged: looks into the libdispatch crash on the
# Linux arm64 rows of swift.yml. A worker thread there dies in
# `_dispatch_worker_thread` on a root queue whose head is
# DISPATCH_OBJECT_LISTLESS, during the asynchronous locks' measurements, and
# on no other row.
#
# It has not been seen anywhere but on this runner, so the search happens
# here, and all at once: every question is a job, each under both Swift
# minors, and each job runs its tests over and over for as long as its budget
# lasts.
#
# The first round asked which commit brought it, and the answer was none: the
# commit before the push it first showed after crashes as often, for the time
# it runs, as develop does. It also crashed four times inside measurements
# that put an actor where the lock would be and run none of this package's
# code — though in a process that had just run the ones that do. This round
# asks whose bug it is, by giving each kind of measurement a process to
# itself.

name: Bisect

# Only a change to this file runs it, and only from a pull request: the branch
# it lives on is pushed nowhere the other workflows listen.
on:
  pull_request:
    paths:
      - .github/workflows/bisect.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bisect:
    name: ${{ matrix.tests.label }} · Swift ${{ matrix.swift }} · ${{ matrix.copy }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # BUDGET is how long a job goes on starting runs, in seconds, and a budget
    # rather than a count because the selections do not take the same time.
    # ENOUGH is how many failures stop a job early, which is there for a job
    # that fails for some other reason and would otherwise do so for its whole
    # budget; it is high because what is wanted now is a rate.
    env:
      BUDGET: 2100
      ENOUGH: 10
      TESTS: ${{ matrix.tests.filter }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.4"]
        # The same job twice over: a crash every ten minutes or so is three in
        # a budget, and a selection that shows none should have had the chance
        # to show six.
        copy: [a, b]
        # "Actors" is the one that decides it. Those measurements are an
        # actor, `Task.yield` and the harness, whose `Atomic` is the standard
        # library's on Linux: a crash there is in a process that never ran a
        # line of the package's locks. "Locks" is the rest of the two suites
        # that have crashed, for a rate to hold the other against. "Semaphore"
        # is the suite that never has, which may only mean that it is short.
        tests:
          - label: Actors
            filter: AsyncMutexPerformanceTests/test.*Actor$
          - label: Locks
            filter: AsyncMutexPerformanceTests/test(Uncontended|ShortQueue|LongQueue|VeryLongQueue|HighPriorityAmongLowWaiters)$|AsyncRWLockPerformanceTests
          - label: Semaphore
            filter: AsyncSemaphorePerformanceTests
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2249809e8a068293a370fd618b1804c6f875bf5b

      # As swift.yml installs it.
      - name: Install Swift toolchain
        run: |
          curl -fL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -C "$RUNNER_TEMP" -zxf "$RUNNER_TEMP/swiftly.tar.gz"
          "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use "${{ matrix.swift }}" --post-install-file "$RUNNER_TEMP/swiftly-post-install.sh"
          if [ -f "$RUNNER_TEMP/swiftly-post-install.sh" ]; then
            sudo bash "$RUNNER_TEMP/swiftly-post-install.sh"
          fi
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - run: swift --version

      # The release test build of swift.yml's rows, flag for flag, since what
      # crashes there is that binary.
      - name: swift build --build-tests
        run: |
          test_flags="-c release -Xswiftc -DSYNCHRONIZATIONKIT_LONG_TESTS"
          echo "test_flags=$test_flags" >> "$GITHUB_ENV"
          swift build --build-tests $test_flags

      # A run that passes says so in a line, with how many tests it ran: a
      # pattern that matches nothing passes too, and would pass for the whole
      # budget, so that ends the job instead. One that fails shows the test it
      # was in and what the backtracer said, less the line in which `swift
      # test` names every test it was asked for. The count goes to the run's
      # summary, where the twelve jobs read as a table.
      - name: Run the tests until the budget is spent
        run: |
          runs=0 failures=0
          while [ $SECONDS -lt "$BUDGET" ] && [ $failures -lt "$ENOUGH" ]; do
            runs=$((runs + 1))
            if swift test --skip-build $test_flags --disable-testable-imports --disable-swift-testing \
              --filter "$TESTS" > "$RUNNER_TEMP/run.log" 2>&1; then
              executed="$(grep -oE "Executed [0-9]+ tests" "$RUNNER_TEMP/run.log" | sort -t ' ' -k 2 -n | tail -n 1)"
              echo "run $runs passed at ${SECONDS}s: $executed"
              case "$executed" in
                "" | "Executed 0 tests") echo "The pattern matched no test." >&2; exit 2 ;;
              esac
            else
              failures=$((failures + 1))
              echo "::group::run $runs failed at ${SECONDS}s"
              grep -E "^Test Case .* started" "$RUNNER_TEMP/run.log" | tail -n 1
              grep -v "^error: Process" "$RUNNER_TEMP/run.log" | grep -A 6 -E "Program crashed|crashed:|^error" || tail -n 40 "$RUNNER_TEMP/run.log" | cut -c 1-300
              echo "::endgroup::"
            fi
          done
          echo "| ${{ matrix.tests.label }} | ${{ matrix.swift }} | ${{ matrix.copy }} | $failures of $runs | ${SECONDS}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "$failures of $runs runs failed in ${SECONDS}s"
          [ $failures -eq 0 ]
