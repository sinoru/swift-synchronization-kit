# Temporary, and not to be merged: finds which commit brought the libdispatch
# crash to the Linux arm64 rows of swift.yml. A worker thread there dies in
# `_dispatch_worker_thread` on a root queue whose head is
# DISPATCH_OBJECT_LISTLESS, during the asynchronous locks' measurements, about
# one run in two and on no other row.
#
# It has not been seen anywhere but on this runner, so the search happens here
# and all at once rather than by halves: every candidate is a job, each under
# both Swift minors, and each job runs the suites over and over for as long as
# its budget lasts. A run takes as long as one job, however many candidates
# there are.

name: Bisect

# Only a change to this file runs it, and only from a pull request: the branch
# it lives on is pushed nowhere the other workflows listen.
on:
  pull_request:
    paths:
      - .github/workflows/bisect.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bisect:
    name: ${{ matrix.ref.label }} · Swift ${{ matrix.swift }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # BUDGET is how long a job goes on starting runs, in seconds, and a budget
    # rather than a count because the candidates do not run the same amount:
    # the first has no AsyncRWLock measurements at all. ENOUGH is how many
    # failures settle the matter for a candidate, and also what stops a job
    # that fails for some other reason from failing for its whole budget.
    # SUITES is the two that have crashed; AsyncSemaphore's never has.
    env:
      BUDGET: 2100
      ENOUGH: 4
      SUITES: AsyncMutexPerformanceTests|AsyncRWLockPerformanceTests
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.4"]
        # Oldest first. The first is the last commit before the push the crash
        # arrived with, and is here to say whether it arrived with that push
        # at all: some fifteen runs passed on it, which one run in two does
        # not do by chance, but an image can change under a commit. The next
        # four are that push, and the last is where develop stands.
        ref:
          - { sha: b407083998a07a4a0a32dd3775a5ad67bf3f36ca, label: "0 · b407083 before the push" }
          - { sha: 627215a290a39694c1b7c6063d5a68b397af5000, label: "1 · 627215a AsyncRWLock measurements" }
          - { sha: 861d0dbfaf51299d6d65e05c3932a017f3a20a65, label: "2 · 861d0db exclusivity unchecked" }
          - { sha: 3738fa0c5ab0f2120393c0f8b9806d5f1366eb53, label: "3 · 3738fa0 noncopyable wait state" }
          - { sha: 6eb547f55d4a9f55d4ba4625e4f20fe05f8ae65f, label: "4 · 6eb547f holder read in place" }
          - { sha: 2249809e8a068293a370fd618b1804c6f875bf5b, label: "5 · 2249809 develop" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref.sha }}

      # As swift.yml installs it.
      - name: Install Swift toolchain
        run: |
          curl -fL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -C "$RUNNER_TEMP" -zxf "$RUNNER_TEMP/swiftly.tar.gz"
          "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use "${{ matrix.swift }}" --post-install-file "$RUNNER_TEMP/swiftly-post-install.sh"
          if [ -f "$RUNNER_TEMP/swiftly-post-install.sh" ]; then
            sudo bash "$RUNNER_TEMP/swiftly-post-install.sh"
          fi
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - run: swift --version

      # The release test build of swift.yml's rows, flag for flag, since what
      # crashes there is that binary.
      - name: swift build --build-tests
        run: |
          test_flags="-c release -Xswiftc -DSYNCHRONIZATIONKIT_LONG_TESTS"
          echo "test_flags=$test_flags" >> "$GITHUB_ENV"
          swift build --build-tests $test_flags

      # A run that passes says so in a line. One that fails shows the test it
      # was in and what the backtracer said, less the line in which `swift
      # test` names every test it was asked for. The count goes to the run's
      # summary, where the twelve jobs read as a table.
      - name: Run the suites until the budget is spent
        run: |
          runs=0 failures=0
          while [ $SECONDS -lt "$BUDGET" ] && [ $failures -lt "$ENOUGH" ]; do
            runs=$((runs + 1))
            if swift test --skip-build $test_flags --disable-testable-imports --disable-swift-testing \
              --filter "$SUITES" > "$RUNNER_TEMP/run.log" 2>&1; then
              echo "run $runs passed at ${SECONDS}s"
            else
              failures=$((failures + 1))
              echo "::group::run $runs failed at ${SECONDS}s"
              grep -E "^Test Case .* started" "$RUNNER_TEMP/run.log" | tail -n 1
              grep -v "^error: Process" "$RUNNER_TEMP/run.log" | grep -A 6 -E "Program crashed|crashed:|^error" || tail -n 40 "$RUNNER_TEMP/run.log" | cut -c 1-300
              echo "::endgroup::"
            fi
          done
          echo "| ${{ matrix.ref.label }} | ${{ matrix.swift }} | $failures of $runs |" >> "$GITHUB_STEP_SUMMARY"
          echo "$failures of $runs runs failed"
          [ $failures -eq 0 ]
